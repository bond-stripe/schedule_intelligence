$schema: https://stripe.com/stripe-app/v2.0.0/schema
id: sub-schedules-search
name: Future Dated Subscriptions
version: 0.0.5
icon: ''
declarations:
  distribution_type: private
  stripe_api_access:
    permissions:
      - permission: customer_read
        purpose: Show customer details for matching subscription schedules
      - permission: subscription_read
        purpose: List future subscription schedules and search first-phase metadata
ui_extension:
  views:
    - viewport: stripe.dashboard.subscription.list
      component: ScheduleSearch
    - viewport: stripe.dashboard.customer.detail
      component: ScheduleSearchCustomerDetail
    - viewport: stripe.dashboard.subscription.detail
      component: ScheduleSearchSubscriptionDetail
    - viewport: stripe.dashboard.drawer.default
      component: ScheduleSearchDrawer
  content_security_policy:
    purpose: ''
extensions: []
